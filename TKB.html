};

let cmdActive = -1;
function openCmd() {
  document.getElementById('cmd-overlay').classList.add('open');
  document.getElementById('cmd-input').value = '';
  cmdActive = -1;
  renderCmdResults('');
  setTimeout(() => document.getElementById('cmd-input').focus(), 60);
}
function closeCmd() { document.getElementById('cmd-overlay').classList.remove('open'); }

function renderCmdResults(q) {
  const q2   = q.toLowerCase();
  const list = CMD_LIST.filter(c => c.label.toLowerCase().includes(q2));
  const tasks = Object.values(state.tasks).filter(t => t.name.toLowerCase().includes(q2) && !t.done).slice(0,4);
  const r    = document.getElementById('cmd-results');
  r.innerHTML = '';

  if (list.length) {
    const lbl = document.createElement('div'); lbl.className = 'cmd-section-label'; lbl.textContent = 'Commands'; r.appendChild(lbl);
    list.forEach((cmd, i) => {
      const el = document.createElement('div');
      el.className = `cmd-item${cmdActive === i ? ' active' : ''}`;
      el.innerHTML = `<span class="cmd-item-icon">${ICONS[cmd.icon]||''}</span>${escHtml(cmd.label)}${cmd.kbd ? `<span class="cmd-item-kbd">${escHtml(cmd.kbd)}</span>` : ''}`;
      el.addEventListener('click', () => { cmd.action(); closeCmd(); });
      r.appendChild(el);
    });
  }

  if (tasks.length) {
    const lbl = document.createElement('div'); lbl.className = 'cmd-section-label'; lbl.textContent = 'Tasks'; r.appendChild(lbl);
    tasks.forEach(t => {
      const cat = CAT[t.cat] || CAT.work;
      const el = document.createElement('div');
      el.className = 'cmd-item';
      el.innerHTML = `<span class="cmd-item-icon">${ICONS.cal}</span>${escHtml(t.name)}<span class="cat-pill" style="--c:${cat.color}">${cat.label}</span>`;
      el.addEventListener('click', () => { openEditModal(t.id); closeCmd(); });
      r.appendChild(el);
    });
  }

  if (!r.children.length) {
    r.innerHTML = '<div class="cmd-item" style="color:var(--text3);pointer-events:none">No results</div>';
  }
}

document.getElementById('cmd-input').addEventListener('input', e => renderCmdResults(e.target.value));
document.getElementById('cmd-overlay').addEventListener('click', e => { if (e.target === document.getElementById('cmd-overlay')) closeCmd(); });
document.getElementById('btn-cmd').addEventListener('click', openCmd);

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const inInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable;
  const modalOpen = document.getElementById('modal-overlay').classList.contains('open');
  const cmdOpen   = document.getElementById('cmd-overlay').classList.contains('open');

  // Always-active
  if (e.key === 'Escape') {
    if (cmdOpen)   { closeCmd(); return; }
    if (modalOpen) { closeModal(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmd(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); document.getElementById('sidebar-toggle').click(); return; }
  if (modalOpen && e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA') { saveTask(); return; }
  if (cmdOpen) return;
  if (inInput) return;

  // View shortcuts
  if (e.key === '1') switchView('day');
  if (e.key === '2') switchView('week');
  if (e.key === '3') switchView('agenda');
  if (e.key === '4') switchView('analytics');

  // Navigation
  if (e.key === 'ArrowLeft')  { currentDate = addDays(currentDate,-1); renderAll(); }
  if (e.key === 'ArrowRight') { currentDate = addDays(currentDate, 1); renderAll(); }
  if (e.key === 't' || e.key === 'T') { currentDate = new Date(); renderAll(); }
  if (e.key === 'n' || e.key === 'N') { document.getElementById('btn-add-task').click(); }
  if (e.key === 'p' || e.key === 'P') { document.getElementById('pomo-start').click(); }
});

/* ═══════════════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════════════ */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `flow-backup-${dateKey(new Date())}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Data exported successfully.', 'success');
}
document.getElementById('btn-export').addEventListener('click', exportData);

/* ═══════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ═══════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════ */
loadState();
buildTimeline();
renderAll();
updatePomoUI();

// Seed demo tasks if empty
if (!Object.keys(state.tasks).length) {
  const today = dateKey(new Date());
  const seed = [
    { id:'demo_1', name:'Morning Review',         start:'08:00', end:'08:30', cat:'work',     priority:'high',   energy:'medium', note:'Check overnight messages',  done:false, created:new Date().toISOString() },
    { id:'demo_2', name:'Deep Work Block',         start:'09:00', end:'11:00', cat:'work',     priority:'critical',energy:'high',  note:'PRO192 assignment work',    done:false, created:new Date().toISOString() },
    { id:'demo_3', name:'OSG202 Study Session',    start:'14:00', end:'16:00', cat:'study',    priority:'high',   energy:'high',  note:'Chapter 3 page replacement',done:false, created:new Date().toISOString() },
    { id:'demo_4', name:'Evening Exercise',        start:'17:30', end:'18:30', cat:'health',   priority:'medium', energy:'high',  note:'Run or gym',                 done:false, created:new Date().toISOString() },
    { id:'demo_5', name:'CTF Lab Practice',        start:'20:00', end:'21:30', cat:'study',    priority:'medium', energy:'medium',note:'Security training session',  done:false, created:new Date().toISOString() },
    { id:'demo_6', name:'Read & Wind Down',        start:'22:00', end:'22:30', cat:'personal', priority:'low',    energy:'low',   note:'',                           done:false, created:new Date().toISOString() },
  ];
  seed.forEach(t => { state.tasks[t.id] = t; });
  const sched = getSchedule();
  ['demo_1','demo_2','demo_3','demo_4','demo_5'].forEach(id => {
    const t = state.tasks[id];
    const sk = t.start.slice(0,5); // use start time as slot
    if (!sched[sk]) sched[sk] = []; sched[sk].push(id);
  });
  state.pool[today] = ['demo_6'];
  saveState(); renderAll();
}
